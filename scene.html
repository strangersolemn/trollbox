<!doctype html><html><head><meta charset="utf-8"><title>Trollbox scene</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Full-screen typing scene for recording the video. 16:9 stage scaled to the window. ?speed=1.3 ?square=1 (1:1) -->
<style>html,body{margin:0;height:100%;background:#0b0b0b;display:flex;align-items:center;justify-content:center;overflow:hidden}#s{width:min(100vw,177.78vh);aspect-ratio:16/9}#s.sq{width:min(100vw,100vh);aspect-ratio:1}</style>
</head><body><div id="s"></div>
<script src="recolor.js"></script><script src="troll-sprites.js"></script><script src="troll-lines.js"></script><script src="trollbox-scene.js"></script>
<script>const Q=new URLSearchParams(location.search);if(Q.get('square'))document.getElementById('s').className='sq';
mountScene(document.getElementById('s'),{lines:TROLL_LINES,speed:+(Q.get('speed')||1)});</script>
</body></html>
