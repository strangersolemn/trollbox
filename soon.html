<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trollbox Opens Soon</title>
<meta name="description" content="the trollbox opens soon. hold your relays.">
<!-- Where "the trollbox" links go until the line board is live (2026-10-20). A random troll types on the monitor. -->
<link rel="stylesheet" href="tb.css">
<style>
.soon{min-height:calc(100vh - 90px);display:grid;place-items:center;text-align:center;padding:40px 0 70px}
.monitor{position:relative;width:min(420px,80vw);margin:0 auto;background:var(--grey);border:5px solid var(--ink);border-radius:22px;padding:20px 20px 38px;box-shadow:12px 12px 0 var(--ink)}
.monitor::after{content:"";position:absolute;right:24px;bottom:12px;width:12px;height:12px;border-radius:50%;background:var(--red);border:3px solid var(--ink);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{background:var(--ink)}}
.monitor canvas{display:block;width:100%;aspect-ratio:1;border:4px solid var(--ink);border-radius:8px}
h1{margin:44px 0 0;font-size:clamp(56px,11vw,120px);color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.relays{display:inline-block;margin:22px 0 0;font:clamp(26px,5vw,40px)/1 var(--hand);background:var(--butter);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:12px 18px 8px;transform:rotate(-1.5deg)}
.cta{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:40px}
</style></head><body>
<nav>
  <a class="logo" href="index.html" aria-label="trollbox"><img src="logo/trollbox-logo-red.png" alt="TROLLBOX"></a>
  <div class="links"><a href="index.html">home</a><a href="gallery.html">gallery</a><a href="soon.html">the trollbox</a><a href="cafe.html">café</a></div>
  <a class="btn small yellow" href="https://discord.gg/3cAwmXFF7u">discord</a>
</nav>
<main class="soon"><div class="wrap">
  <div class="monitor"><canvas id="c" width="512" height="512" aria-label="a troll typing"></canvas></div>
  <h1>trolling opens soon</h1>
  <span class="relays">hold your relays.</span>
  <div class="cta"><a class="btn red" href="gallery.html">find your troll</a><a class="btn" href="cafe.html">walk into the café</a></div>
</div></main>
<script src="recolor.js"></script><script src="troll-sprites.js"></script><script src="tb-site.js"></script>
<script>
TB.load(512).then(async T => { const t = T.trolls[Math.floor(Math.random() * T.trolls.length)]; TB.animate(document.getElementById("c"), T, await T.sprite(t)); });
</script><script src="music.js?v=3"></script>
</body></html>
